version: '3.8'

services:
  splunk:
    image: splunk/splunk:9.0.9
    container_name: splunk_enterprise
    hostname: splunk
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=adminadmin
      - SPLUNK_WEB_CONFIG=tools.proxy.on=true
    ports:
      - "8089:8089"
    volumes:
      - splunk-var:/opt/splunk/var
      - splunk-etc:/opt/splunk/etc

  nginx:
    image: nginx:alpine
    container_name: splunk_nginx
    ports:
      - "12123:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - splunk

volumes:
  splunk-var:
  splunk-etc:
